  <a href="#main-content" class="skip-link">Gara qabiyyee ijoo darbi</a>
  <header>
    <nav class="navbar" aria-label="Deemsa Ijoo">
      <div class="navbar__inner">
        <!-- Logo -->
        <a href="index.html" class="navbar__logo" aria-label="Fuula Jalqabaa Agro AI">
          <i data-lucide="sprout"></i>
          <span>Agro AI</span>
        </a>

        <!-- Navigation Links -->
        <ul class="navbar__menu" id="nav-menu" role="list">
          <li><a href="index.html" class="nav-link" data-page="index">Fuula Jalqabaa</a></li>
